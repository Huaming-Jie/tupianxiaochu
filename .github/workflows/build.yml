# ============================================================================
# 自动构建 Windows EXE 并发布到 GitHub Release
# ----------------------------------------------------------------------------
# 触发：推送形如 v* 的 tag（例如 v1.0.0）
#   git tag v1.0.0
#   git push origin v1.0.0
# 效果：在 Windows runner 上 pyinstaller 打包 -> 压缩为 zip ->
#       作为自动创建的 Release 附件（smart_image_editor-<tag>-win64.zip）
# ============================================================================
name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python Pillow PyQt5 PyMuPDF requests tqdm onnxruntime pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build.spec --noconfirm --clean

      - name: Package artifact
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          Compress-Archive -Path dist/smart_image_editor/* -DestinationPath "smart_image_editor-$ver-win64.zip" -Force

      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: smart_image_editor-*-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
